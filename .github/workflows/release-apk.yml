name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android Project
        run: |
          mkdir -p android/app/src/main/assets/www/css
          mkdir -p android/app/src/main/assets/www/js
          mkdir -p android/app/src/main/assets/www/icons
          cp index.html manifest.json android/app/src/main/assets/www/
          cp -r css/* android/app/src/main/assets/www/css/
          cp -r js/* android/app/src/main/assets/www/js/
          cp -r icons/* android/app/src/main/assets/www/icons/

      - name: Assemble Release APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
