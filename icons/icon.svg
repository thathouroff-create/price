<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2d3748" stroke-width="8"/>
  <rect x="76" y="80" width="360" height="96" rx="20" fill="#141a24" stroke="#2d3748" stroke-width="4"/>
  <text x="408" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="700" fill="#4ade80" text-anchor="end">% ₽ 100</text>
  <g transform="translate(76, 206)">
    <!-- Button 1: % -->
    <rect x="0" y="0" width="104" height="96" rx="18" fill="#1e2533" stroke="#2d3748" stroke-width="3"/>
    <text x="52" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#60a5fa" text-anchor="middle">%</text>
    <!-- Button 2: ₽ -->
    <rect x="128" y="0" width="104" height="96" rx="18" fill="#1e2533" stroke="#2d3748" stroke-width="3"/>
    <text x="180" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#4ade80" text-anchor="middle">₽</text>
    <!-- Button 3: ÷ -->
    <rect x="256" y="0" width="104" height="96" rx="18" fill="#1e2533" stroke="#2d3748" stroke-width="3"/>
    <text x="308" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#94a3b8" text-anchor="middle">÷</text>
    <!-- Row 2 -->
    <!-- Button 4: кг -->
    <rect x="0" y="120" width="104" height="96" rx="18" fill="#1e2533" stroke="#2d3748" stroke-width="3"/>
    <text x="52" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#cbd5e1" text-anchor="middle">кг</text>
    <!-- Button 5: л -->
    <rect x="128" y="120" width="104" height="96" rx="18" fill="#1e2533" stroke="#2d3748" stroke-width="3"/>
    <text x="180" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="700" fill="#cbd5e1" text-anchor="middle">л</text>
    <!-- Button 6: = -->
    <rect x="256" y="120" width="104" height="96" rx="18" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="308" y="182" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">=</text>
  </g>
</svg>
