<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="#334155" stroke-width="6"/>

  <!-- 4 Vibrant Calculator Quads with Shadows -->
  <!-- Top Left: % (Cyan) -->
  <rect x="76" y="76" width="164" height="164" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="14" fill="#38bdf8"/>
  <circle cx="188" cy="188" r="14" fill="#38bdf8"/>
  <line x1="194" y1="122" x2="122" y2="194" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>

  <!-- Top Right: + (Emerald) -->
  <rect x="272" y="76" width="164" height="164" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <line x1="354" y1="116" x2="354" y2="200" stroke="#4ade80" stroke-width="16" stroke-linecap="round"/>
  <line x1="312" y1="158" x2="396" y2="158" stroke="#4ade80" stroke-width="16" stroke-linecap="round"/>

  <!-- Bottom Left: − (Purple/Violet) -->
  <rect x="76" y="272" width="164" height="164" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <line x1="116" y1="354" x2="200" y2="354" stroke="#c084fc" stroke-width="16" stroke-linecap="round"/>

  <!-- Bottom Right: = (Accent Blue Filled) -->
  <rect x="272" y="272" width="164" height="164" rx="40" fill="url(#blueG)" filter="url(#shadow)"/>
  <line x1="314" y1="336" x2="394" y2="336" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="314" y1="372" x2="394" y2="372" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
