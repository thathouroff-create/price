<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';">
    <meta name="theme-color" content="#0a0e17">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Умный калькулятор выгодных цен и универсальный калькулятор процентов">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <title>Calc+</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <div class="app-container">
        <!-- PWA Install Banner -->
        <aside id="pwaInstallBanner" class="pwa-install-banner" style="display: none;" aria-label="Предложение установки">
            <div class="pwa-install-info">
                <img src="./icons/icon.svg" alt="" class="pwa-install-icon" width="32" height="32">
                <div class="pwa-install-text">
                    <strong class="pwa-install-title">Установить Calc+</strong>
                    <span class="pwa-install-desc">Быстрый запуск с экрана и работа без интернета</span>
                </div>
            </div>
            <div class="pwa-install-actions">
                <button type="button" id="pwaInstallConfirm" class="pwa-confirm-btn">Установить</button>
                <button type="button" id="pwaInstallDismiss" class="pwa-dismiss-btn" aria-label="Закрыть">✕</button>
            </div>
        </aside>

        <!-- Header -->
        <header class="app-header">
            <div class="brand-title">
                <img src="./icons/icon.svg" alt="" class="brand-icon" width="28" height="28">
                <h1 class="brand-name">Calc+</h1>
            </div>
            <div class="header-actions">
                <button type="button" id="installAppBtn" class="theme-btn install-btn" aria-label="Установить приложение" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Установить</span>
                </button>
                <button type="button" id="themeToggleBtn" class="theme-btn" aria-label="Сменить тему оформления">
                    🌙 Тёмная
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs-nav" role="tablist" aria-label="Режимы калькулятора">
            <button type="button" class="tab-btn" role="tab" id="tabPrice" data-tab="price" aria-selected="true" aria-controls="panelPrice" tabindex="0">
                <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                    <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                <span class="tab-label-full">Сравнение цен</span>
                <span class="tab-label-short">Цены</span>
            </button>
            <button type="button" class="tab-btn" role="tab" id="tabPercent" data-tab="percent" aria-selected="false" aria-controls="panelPercent" tabindex="-1">
                <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="5" x2="5" y2="19"/>
                    <circle cx="6.5" cy="6.5" r="2.5"/>
                    <circle cx="17.5" cy="17.5" r="2.5"/>
                </svg>
                <span class="tab-label-full">Проценты</span>
                <span class="tab-label-short">Проценты</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main>
            <!-- Panel 1: Price Comparison -->
            <section class="tab-panel active" role="tabpanel" id="panelPrice" aria-labelledby="tabPrice"></section>

            <!-- Panel 2: Percent Calculator -->
            <section class="tab-panel" role="tabpanel" id="panelPercent" aria-labelledby="tabPercent"></section>
        </main>
    </div>

    <!-- Global Toast Notification -->
    <div id="globalToast" class="toast-msg" role="status" aria-live="polite">
        <span class="toast-text"></span>
        <button type="button" class="toast-action-btn" style="display: none;"></button>
    </div>

    <!-- Application Scripts -->
    <script src="./js/calc-core.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/ui-price.js"></script>
    <script src="./js/ui-percent.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
