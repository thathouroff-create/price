<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CalcCore Unit & Property Test Suite</title>
</head>
<body>
  <h1>Running CalcCore Test Suite...</h1>
  <div id="output"></div>

  <!-- Load production CalcCore engine directly -->
  <script src="../js/calc-core.js"></script>
  <script>
    (function() {
      var tests = [];
      var passed = 0;
      var failed = 0;
      var failLog = [];

      function assert(desc, condition, details) {
        tests.push(desc);
        if (condition) {
          passed++;
        } else {
          failed++;
          failLog.push('FAIL: ' + desc + (details ? ' (' + details + ')' : ''));
        }
      }

      var C = window.CalcCore;
      if (!C) {
        document.body.innerHTML = '<pre id="result">TOTAL=1 PASS=0 FAIL=1\nFAIL: CalcCore not loaded</pre>';
        return;
      }

      /* 1. parseNum */
      assert('parseNum valid integer', C.parseNum('42') === 42);
      assert('parseNum with comma', C.parseNum('12,5') === 12.5);
      assert('parseNum with space grouping', C.parseNum('1 000,5') === 1000.5);
      assert('parseNum with NBSP', C.parseNum('2\u00A0500,75') === 2500.75);
      assert('parseNum invalid string returns NaN', isNaN(C.parseNum('12abc')));
      assert('parseNum empty string returns NaN', isNaN(C.parseNum('')));
      assert('parseNum single comma returns NaN', isNaN(C.parseNum(',')));
      assert('parseNum number input', C.parseNum(89.9) === 89.9);

      /* 2. roundHalfUp */
      assert('roundHalfUp 1.005 -> 1.01', C.roundHalfUp(1.005, 2) === 1.01);
      assert('roundHalfUp 2.675 -> 2.68', C.roundHalfUp(2.675, 2) === 2.68);
      assert('roundHalfUp negative -1.005 -> -1.01', C.roundHalfUp(-1.005, 2) === -1.01);
      assert('roundHalfUp 0 decimals', C.roundHalfUp(14.6, 0) === 15);
      assert('roundHalfUp 4 decimals', C.roundHalfUp(1.23456, 4) === 1.2346);

      /* 3. formatNum */
      assert('formatNum valid number', C.formatNum(1000.5, 2).replace(/\s/g, '').replace(',', '.') === '1000.5');
      assert('formatNum NaN returns dash', C.formatNum(NaN) === '—');

      /* 4. Unit pricing & conversions */
      var itemG = { price: '89,9', qty: '450', unit: 'g', packCount: 1, promoType: 'none' };
      var resG = C.calcItemUnitPrice(itemG);
      assert('unitPrice for 450g at 89.9', C.roundHalfUp(resG.unitPrice, 2) === 199.78);
      assert('displayUnit is ₽/кг', resG.displayUnit === '₽/кг');

      var itemL = { price: '120', qty: '1.5', unit: 'l', packCount: 1, promoType: 'none' };
      var resL = C.calcItemUnitPrice(itemL);
      assert('unitPrice for 1.5L at 120', C.roundHalfUp(resL.unitPrice, 2) === 80);

      /* 5. Promos & Multipacks */
      var itemPromoDisc = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'percent', promoVal: '20' };
      var resPromoDisc = C.calcItemUnitPrice(itemPromoDisc);
      assert('promo 20% discount on 100', resPromoDisc.unitPrice === 80);

      var itemCard = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'card', promoVal: '79' };
      var resCard = C.calcItemUnitPrice(itemCard);
      assert('promo card price 79', resCard.unitPrice === 79);

      var item2For1 = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'two_for_one' };
      var res2For1 = C.calcItemUnitPrice(item2For1);
      assert('promo 2 for 1 is 50%', res2For1.unitPrice === 50);

      var itemMultipack = { price: '300', qty: '0.5', unit: 'l', packCount: 6, promoType: 'none' };
      var resMultipack = C.calcItemUnitPrice(itemMultipack);
      assert('multipack 6 x 0.5L = 3L at 300 -> 100/L', resMultipack.unitPrice === 100);

      /* 6. Product comparison & ties */
      var p1 = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'none' };
      var p2 = { price: '150', qty: '1', unit: 'kg', packCount: 1, promoType: 'none' };
      var comp1 = C.compareProducts([p1, p2]);
      assert('compare detects p1 as best', comp1.bestDealIdxs.length === 1 && comp1.bestDealIdxs[0] === 0);
      assert('compare p2 diff percent is +50%', comp1.items[1].diffPercent === 50);

      // Exact tie
      var pTie1 = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'none' };
      var pTie2 = { price: '200', qty: '2', unit: 'kg', packCount: 1, promoType: 'none' };
      var compTie = C.compareProducts([pTie1, pTie2]);
      assert('compare detects exact tie', compTie.isExactTie === true && compTie.bestDealIdxs.length === 2);

      // Incompatible units (weight vs volume)
      var pMix1 = { price: '100', qty: '1', unit: 'kg', packCount: 1, promoType: 'none' };
      var pMix2 = { price: '100', qty: '1', unit: 'l', packCount: 1, promoType: 'none' };
      var compMix = C.compareProducts([pMix1, pMix2]);
      assert('compare detects incompatible units', compMix.hasIncompatibleUnits === true);

      /* 7. Percent Operations (Op 1 to 12) */
      // Op 1: 15% of 200 = 30
      var op1 = C.calcPercent('1', '15', '200');
      assert('op1 15% of 200 = 30', op1.res === 30);

      // Op 2: 30 of 200 = 15%
      var op2 = C.calcPercent('2', '30', '200');
      assert('op2 30 of 200 = 15%', op2.res === 15);
      var op2Zero = C.calcPercent('2', '30', '0');
      assert('op2 division by 0 handled', !!op2Zero.error);

      // Op 3: 200 + 15% = 230
      var op3 = C.calcPercent('3', '200', '15');
      assert('op3 200 + 15% = 230', op3.res === 230);

      // Op 4: 200 - 15% = 170
      var op4 = C.calcPercent('4', '200', '15');
      assert('op4 200 - 15% = 170', op4.res === 170);

      // Op 5: 230 is 15% greater than 200
      var op5 = C.calcPercent('5', '230', '200');
      assert('op5 230 > 200 is 15%', C.roundHalfUp(op5.res, 2) === 15);
      assert('op5 div by 0 handled', !!C.calcPercent('5', '230', '0').error);

      // Op 6: 170 is 15% less than 200
      var op6 = C.calcPercent('6', '170', '200');
      assert('op6 170 < 200 is 15%', C.roundHalfUp(op6.res, 2) === 15);

      // Op 7: 30 is 15%, find 100% -> 200
      var op7 = C.calcPercent('7', '30', '15');
      assert('op7 30 is 15% -> 200', op7.res === 200);

      // Op 8: change from 200 to 150 = -25%
      var op8 = C.calcPercent('8', '200', '150');
      assert('op8 200 -> 150 is -25%', op8.res === -25);
      assert('op8 base 0 handled', !!C.calcPercent('8', '0', '150').error);

      // Op 9: NDS 20%
      var op9Extract = C.PERCENT_OPERATIONS['9'].calc(120, 1);
      assert('op9 extract NDS from 120 is 20', C.roundHalfUp(op9Extract.res, 2) === 20);
      var op9Add = C.PERCENT_OPERATIONS['9'].calc(100, 2);
      assert('op9 add NDS to 100 is 120', C.roundHalfUp(op9Add.res, 2) === 120);

      // Op 10: Markup and Margin (Cost 100, markup 25% -> price 125, margin 20%)
      var op10 = C.PERCENT_OPERATIONS['10'].calc(100, 25);
      assert('op10 cost 100 markup 25% -> 125', op10.res === 125);

      // Op 11: Compound interest (1000 at 12% for 12 months)
      var op11 = C.PERCENT_OPERATIONS['11'].calc(1000, 12, 12);
      assert('op11 compound interest works', op11.res > 1120);

      // Op 12: Discount (old 200, new 150 -> saving 50, discount 25%)
      var op12 = C.PERCENT_OPERATIONS['12'].calc(200, 150);
      assert('op12 discount 200 -> 150 is 50 saving', op12.res === 50);

      /* 8. Property-based checks (inverse operations) */
      for (var k = 1; k <= 20; k++) {
        var baseVal = 100 + k * 17.5;
        var pctVal = 5 + (k % 40);
        // op1 and op7 inverse relation
        var part = (pctVal / 100) * baseVal;
        var full = C.calcPercent('7', String(part), String(pctVal)).res;
        assert('property: op1 and op7 inverse (iter ' + k + ')', Math.abs(full - baseVal) < 1e-6);
      }

      /* Print results */
      var outPre = document.createElement('pre');
      outPre.id = 'result';
      var summary = 'TOTAL=' + (passed + failed) + ' PASS=' + passed + ' FAIL=' + failed;
      if (failLog.length > 0) {
        summary += '\n' + failLog.join('\n');
      }
      outPre.textContent = summary;
      document.body.appendChild(outPre);
    })();
  </script>
</body>
</html>
